<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | Orvera Home</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/orvexa-logo.png">

<link href="css/login.css" rel="stylesheet">

<script defer src="js/app.js"></script></head>
<body class="auth-page">
<div class="authtools" aria-label="Page controls">
  <button class="icon theme-control" type="button" onclick="themeToggle()" aria-label="Toggle dark mode"><i class="bi bi-moon-stars"></i></button>
  <button class="icon direction-control" type="button" onclick="rtlToggle()" aria-label="Switch text direction">RTL</button>
</div>
<main class="authcard">
  <a class="authbrand" href="index.html" aria-label="Go to Orvera Home main page">
    <img src="assets/orvexa-logo-transparent.png" alt="Orvera Home logo">
    <span class="authbrand-copy">
      <strong class="authbrand-name"><span class="orvera">Orvera</span> <span class="home">Home</span></strong>
      <small>Connected Care. Right at Home.</small>
    </span>
  </a>
  <h1>Welcome <span class="headingAccent">Back</span></h1>
  <p class="muted intro">Sign in to manage appointments, home visits and your health information.</p>

  <form class="auth-form" action="dashboard.html" method="get">
    <div class="field">
      <label for="email">Email Address</label>
      <i class="field-icon bi bi-envelope" aria-hidden="true"></i><input id="email" name="email" autocomplete="email" required type="email" placeholder="Enter your email address">
    </div>
    <div class="field">
      <label for="login-password">Password</label>
      <div class="pass">
        <input id="login-password" name="password" autocomplete="current-password" required type="password" placeholder="Enter your password">
        <span class="pass-eye" aria-hidden="true"><i class="bi bi-eye"></i></span>
      </div>
    </div>
    <div class="authlinks">
      <label><input type="checkbox" name="remember"> <span>Remember Me</span></label>
      <a href="#">Forgot Password?</a>
    </div>
    <button class="btn btn-primary auth-submit" type="submit">Login</button>
  </form>

  <div class="auth-divider"><span>or continue with</span></div>
  <div class="auth-social">
    <button class="btn btn-secondary" type="button"><i class="bi bi-google" aria-hidden="true"></i><span>Google</span></button>
    <button class="btn btn-secondary" type="button"><i class="bi bi-apple" aria-hidden="true"></i><span>Apple</span></button>
  </div>
  <p class="center muted auth-switch">Don't have an account? <a href="signup.html">Create Account</a></p>
</main>

</body>
</html>
