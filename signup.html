<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign Up | Orvera Home</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/orvexa-logo.png">

<link href="css/signup.css" rel="stylesheet">

<script defer src="js/app.js"></script></head>
<body class="auth-page">
<div class="authtools" aria-label="Page controls">
  <button class="icon theme-control" type="button" onclick="themeToggle()" aria-label="Toggle dark mode"><i class="bi bi-moon-stars"></i></button>
  <button class="icon direction-control" type="button" onclick="rtlToggle()" aria-label="Switch text direction">RTL</button>
</div>
<main class="authcard">
  <a class="authbrand" href="index.html" aria-label="Go to Orvera Home main page">
    <img src="assets/orvexa-logo-transparent.png" alt="Orvera Home logo">
    <span class="authbrand-copy">
      <strong class="authbrand-name"><span class="orvera">Orvera</span> <span class="home">Home</span></strong>
      <small>Connected Care. Right at Home.</small>
    </span>
  </a>
  <h1>Create <span class="headingAccent">Account</span></h1>
  <p class="muted intro">Create your patient account to arrange home care and manage your health information.</p>

  <form class="auth-form" action="dashboard.html" method="get">
    <div class="field">
      <label for="full-name">Full Name</label>
      <i class="field-icon bi bi-person" aria-hidden="true"></i><input id="full-name" name="fullName" autocomplete="name" required type="text" placeholder="Enter your full name">
    </div>
    <div class="field">
      <label for="signup-email">Email Address</label>
      <i class="field-icon bi bi-envelope" aria-hidden="true"></i><input id="signup-email" name="email" autocomplete="email" required type="email" placeholder="Enter your email address">
    </div>
    <div class="field">
      <label for="phone">Phone Number</label>
      <i class="field-icon bi bi-telephone" aria-hidden="true"></i><input id="phone" name="phone" autocomplete="tel" required type="tel" placeholder="Enter your phone number">
    </div>
    <div class="field">
      <label for="signup-password">Password</label>
      <div class="pass">
        <input id="signup-password" name="password" autocomplete="new-password" required type="password" placeholder="Create a password">
        <span class="pass-eye" aria-hidden="true"><i class="bi bi-eye"></i></span>
      </div>
    </div>
    <div class="field">
      <label for="confirm-password">Confirm Password</label>
      <div class="pass">
        <input id="confirm-password" name="confirmPassword" autocomplete="new-password" required type="password" placeholder="Confirm your password">
        <span class="pass-eye" aria-hidden="true"><i class="bi bi-eye"></i></span>
      </div>
    </div>
    <label class="terms"><input required type="checkbox" name="terms"><span>I agree to the Terms of Service and Privacy Policy.</span></label>
    <button class="btn btn-primary auth-submit" type="submit">Create Account</button>
  </form>

  <div class="auth-divider"><span>or continue with</span></div>
  <div class="auth-social">
    <button class="btn btn-secondary" type="button"><i class="bi bi-google" aria-hidden="true"></i><span> Google</span></button>
    <button class="btn btn-secondary" type="button"><i class="bi bi-apple" aria-hidden="true"></i><span> Apple</span></button>
  </div>
  <p class="center muted auth-switch">Already have an account? <a href="login.html">Login</a></p>
</main>

</body>
</html>
